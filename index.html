<style>
:root{
  /* -- Home Studio inspired: matte noir, brass hardware, warm linen -- luxury-with-grain palette -- */
  --cream:#F6F1E6;
  --ivory:#ECE2CD;
  --charcoal:#1A1611;
  --charcoal-soft:#5a4f40;
  --gold:#B4874A;
  --gold-light:#DEBC85;
  --gold-deep:#7C5A2C;
  --teal:#161210;
  --teal-light:#241D16;
  --white:#FFFFFF;
  --shadow:0 20px 60px -20px rgba(10,8,6,0.45);

  --ease:cubic-bezier(.22,1,.36,1);

}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;overflow-x:hidden;width:100%;}
body{
  margin:0;
  background:var(--cream);
  color:var(--charcoal);

  overflow-x:hidden;
}
h1,h2,h3,h4,.display{

  color:var(--teal);

}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
.eyebrow{

}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
.gold-btn{
  display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--gold-light),var(--gold) 55%,var(--gold-deep));
  color:var(--teal);border:none;padding:14px 30px;border-radius:999px;font-weight:600;font-size:.95rem;
  letter-spacing:.03em;box-shadow:0 10px 25px -8px rgba(122,90,44,.55);transition:transform .35s var(--ease),box-shadow .35s var(--ease);
}
.gold-btn:hover{transform:translateY(-3px);box-shadow:0 16px 34px -10px rgba(122,90,44,.65);}
.ghost-btn{
  display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--teal);color:var(--teal);
  padding:12.5px 28px;border-radius:999px;font-weight:600;font-size:.95rem;transition:all .35s var(--ease);
}
.ghost-btn:hover{background:var(--teal);color:var(--white);}
.ghost-btn.light{border-color:rgba(255,255,255,.6);color:#fff;}
.ghost-btn.light:hover{background:#fff;color:var(--teal);}

/* ---------- reveal on scroll ---------- */
.reveal{opacity:0;transform:translateY(36px);transition:opacity .9s var(--ease),transform .9s var(--ease);}
.reveal.in{opacity:1;transform:translateY(0);}
.reveal.stagger > *{opacity:0;transform:translateY(28px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
.reveal.stagger.in > *{opacity:1;transform:translateY(0);}
.reveal.stagger.in > *:nth-child(1){transition-delay:.05s}
.reveal.stagger.in > *:nth-child(2){transition-delay:.14s}
.reveal.stagger.in > *:nth-child(3){transition-delay:.23s}
.reveal.stagger.in > *:nth-child(4){transition-delay:.32s}
.reveal.stagger.in > *:nth-child(5){transition-delay:.41s}
.reveal.stagger.in > *:nth-child(6){transition-delay:.5s}
.reveal.stagger.in > *:nth-child(7){transition-delay:.59s}
.reveal.stagger.in > *:nth-child(8){transition-delay:.68s}

/* ---------- hero ---------- */
.hero{position:relative;padding:70px 0 90px;overflow:hidden;}
.hero::before{
  content:'';position:absolute;inset:-20% -10% auto -10%;height:640px;
  background:radial-gradient(60% 60% at 30% 30%, rgba(180,135,74,.20), transparent 70%),
             radial-gradient(50% 50% at 80% 20%, rgba(22,18,16,.14), transparent 70%),
             var(--noise);
  background-blend-mode:normal,normal,overlay;
  background-size:auto,auto,150px;
  opacity:.9;
  pointer-events:none;
}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center;position:relative;z-index:2;}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;}}
.hero h1{font-size:clamp(2.3rem,4.6vw,3.6rem);line-height:1.08;margin:16px 0 20px;}
.hero h1 em{font-style:italic;color:var(--gold-deep);}

.hero-stats div span{font-size:.78rem;color:var(--charcoal-soft);letter-spacing:.02em;}

/* signature 3D medallion */
.medallion-stage{perspective:1400px;display:flex;align-items:center;justify-content:center;position:relative;height:440px;}
.medallion{
  width:300px;height:300px;position:relative;transform-style:preserve-3d;
  animation:floaty 6s ease-in-out infinite;
}
.medallion .ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,var(--gold-light),var(--gold),var(--gold-deep),var(--gold),var(--gold-light));
  animation:spin 14s linear infinite;box-shadow:0 30px 70px -20px rgba(122,90,44,.55), inset 0 0 0 10px rgba(255,255,255,.15);
}
.medallion .ring::after{content:'';position:absolute;inset:14px;border-radius:50%;background:var(--cream);}
.medallion .core{
  position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle at 38% 30%, #fff, #f2ead6 60%, #e6d7ad 100%);
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.25), inset 0 0 20px rgba(180,135,74,.3);
  overflow:hidden;
}
.medallion .core img{width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));}
.medallion .shine{
  position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.55) 48%, transparent 65%);
  animation:sweep 4.5s ease-in-out infinite;mix-blend-mode:overlay;
}
.orbit-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px 3px rgba(180,135,74,.7);}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes floaty{0%,100%{transform:translateY(0) rotateX(6deg) rotateY(-8deg);}50%{transform:translateY(-18px) rotateX(-4deg) rotateY(8deg);}}
@keyframes sweep{0%{opacity:0;transform:translateX(-40%);}45%{opacity:1;}100%{opacity:0;transform:translateX(60%);}}
@media(prefers-reduced-motion:reduce){.medallion,.medallion .ring,.medallion .shine{animation:none!important;}}

.review-chip p{font-size:.87rem;color:var(--charcoal-soft);line-height:1.55;min-height:64px;}
.review-chip .who{display:flex;align-items:center;gap:10px;margin-top:12px;}
.review-chip .who .av{width:34px;height:34px;border-radius:50%;background:var(--ivory);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--teal);font-size:.85rem;}
.review-chip .who b{font-size:.85rem;}
.review-chip .who small{color:var(--charcoal-soft);font-size:.72rem;}

/* like heart */
.heart-btn{display:inline-flex;align-items:center;gap:6px;border:none;background:none;color:#c0392b;font-size:.9rem;padding:0;}
.heart-btn svg{width:19px;height:19px;transition:transform .3s var(--ease);}
.heart-btn.liked svg{fill:#c0392b;}
.heart-btn:not(.liked) svg{fill:none;stroke:#c0392b;stroke-width:1.8;}
.heart-btn.pulse svg{animation:pulse .45s var(--ease);}
@keyframes pulse{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}

/* comments */
.comment{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid rgba(180,135,74,.2);}
.comment .av{width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex:none;}
.comment b{font-size:.88rem;}
.comment small{color:var(--charcoal-soft);font-size:.72rem;}
.comment p{margin:4px 0 0;font-size:.88rem;color:var(--charcoal-soft);}
.comment .del{color:#c0392b;font-size:.72rem;font-weight:600;margin-left:auto;}

/* badges / admin edit */
.edit-toolbar{position:fixed;bottom:0;left:0;right:0;background:var(--teal);color:#fff;padding:12px 20px;z-index:900;display:flex;gap:14px;align-items:center;justify-content:center;box-shadow:0 -10px 30px rgba(0,0,0,.25);flex-wrap:wrap;}
.edit-toolbar b{color:var(--gold-light);}
[data-bind][contenteditable="true"]{outline:1.5px dashed var(--gold);outline-offset:4px;border-radius:6px;background:rgba(180,135,74,.08);}
.admin-mini-btn{border:1px solid rgba(180,135,74,.5);background:#fff;color:var(--teal);border-radius:8px;font-size:.72rem;padding:5px 9px;font-weight:600;}
.admin-mini-btn.danger{color:#c0392b;border-color:#c0392b;}
.admin-row-tools{display:flex;gap:6px;margin-top:10px;justify-content:center;flex-wrap:wrap;}
.pill{display:inline-block;background:var(--ivory);color:var(--teal);border-radius:999px;padding:4px 12px;font-size:.72rem;font-weight:700;letter-spacing:.03em;}

/* breadcrumb / detail hero */
.detail-hero{padding:44px 0 30px;background:var(--ivory);}
.crumbs{font-size:.82rem;color:var(--charcoal-soft);margin-bottom:14px;}
.crumbs a{color:var(--gold-deep);font-weight:600;}
.detail-cover{border-radius:22px;overflow:hidden;height:320px;margin:26px 0 34px;box-shadow:var(--shadow);}
.detail-cover img{width:100%;height:100%;object-fit:cover;}
.content-block{max-width:800px;margin:0 auto;line-height:1.85;color:var(--charcoal-soft);font-size:1.02rem;}
.content-block p{margin-bottom:18px;}

.faq-item{border-bottom:1px solid rgba(180,135,74,.25);padding:18px 0;}
.faq-q{display:flex;justify-content:space-between;align-items:center;font-weight:600;cursor:pointer;color:var(--teal);gap:14px;}
.faq-q .chevron{transition:transform .3s var(--ease);flex:none;}
.faq-item.open .chevron{transform:rotate(180deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .4s var(--ease);color:var(--charcoal-soft);font-size:.92rem;line-height:1.7;}
.faq-item.open .faq-a{max-height:400px;padding-top:12px;}

.auth-wrap{max-width:440px;margin:60px auto;}
.tab-row{display:flex;background:var(--ivory);border-radius:999px;padding:5px;margin-bottom:26px;}
.tab-row button{flex:1;padding:11px;border:none;background:none;border-radius:999px;font-weight:600;color:var(--charcoal-soft);}
.tab-row button.active{background:var(--teal);color:#fff;}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:12px;border:1.4px solid rgba(24,23,22,.18);background:#fff;color:var(--charcoal);font-weight:600;font-size:.92rem;transition:box-shadow .25s,transform .25s;}
.google-btn:hover{box-shadow:0 8px 20px -10px rgba(0,0,0,.25);transform:translateY(-1px);}
.or-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--charcoal-soft);font-size:.78rem;}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:rgba(24,23,22,.15);}

.stat-badge{position:fixed;top:90px;right:16px;background:var(--gold);color:var(--teal);padding:8px 14px;border-radius:999px;font-size:.75rem;font-weight:700;z-index:400;box-shadow:var(--shadow);}
.share-row{display:flex;gap:8px;flex-wrap:wrap;}
.share-row a{width:34px;height:34px;border-radius:50%;background:var(--ivory);display:flex;align-items:center;justify-content:center;color:var(--teal);}
.share-row a:hover{background:var(--teal);color:#fff;}

.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(180,135,74,.3);border-top-color:var(--gold);animation:spin .8s linear infinite;margin:40px auto;}
::selection{background:var(--gold-light);}
.dentist-select-note{font-size:.76rem;color:var(--charcoal-soft);margin-top:4px;}

/* ---------- success modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,12,8,.6);backdrop-filter:blur(3px);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);}
.modal-backdrop.show{opacity:1;pointer-events:auto;}
.modal-box{background:var(--cream);border-radius:20px;padding:44px 38px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow);transform:translateY(24px) scale(.96);transition:transform .4s var(--ease);border:1px solid rgba(180,135,74,.3);}
.modal-backdrop.show .modal-box{transform:translateY(0) scale(1);}
.seo-modal-box{max-width:880px;width:94%;text-align:left;max-height:88vh;overflow:auto;}
.seo-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;margin-top:6px;}
@media(max-width:720px){.seo-grid{grid-template-columns:1fr;}}
.seo-img-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px;}
@media(max-width:480px){.seo-img-grid{grid-template-columns:repeat(4,1fr);}}
.seo-img-grid img{width:100%;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.seo-img-grid img.selected{border-color:var(--gold);}
.seo-upload-tile{height:56px;border:2px dashed rgba(180,135,74,.5);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold-deep);}
.seo-kw-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.seo-chip{background:var(--ivory);color:var(--charcoal);padding:5px 10px;border-radius:999px;font-size:.78rem;display:inline-flex;align-items:center;gap:6px;}
.seo-chip button{border:none;background:none;color:#c0392b;font-weight:700;cursor:pointer;font-size:.85rem;padding:0;}
.seo-suggest-label{font-size:.76rem;color:var(--charcoal-soft);margin:14px 0 6px;}
.seo-kw-suggest{display:flex;flex-wrap:wrap;gap:6px;}
.seo-suggest-chip{background:#fff;border:1px solid rgba(180,135,74,.4);color:var(--gold-deep);padding:5px 10px;border-radius:999px;font-size:.76rem;cursor:pointer;}
.seo-desc-warn{color:var(--charcoal-soft);font-weight:600;font-size:.72rem;margin-left:6px;}
.seo-desc-warn.over{color:#c0392b;}
.seo-preview{background:#fff;border:1px solid rgba(24,23,22,.12);border-radius:12px;padding:16px;}
.seo-preview .spv-row{display:flex;gap:12px;align-items:flex-start;}
.seo-preview .spv-icon{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;background:var(--ivory);display:flex;align-items:center;justify-content:center;}
.seo-preview .spv-icon img{width:100%;height:100%;object-fit:cover;}
.seo-preview .spv-name{font-size:.82rem;color:var(--charcoal-soft);font-weight:600;}
.seo-preview .spv-url{font-size:.76rem;color:var(--charcoal-soft);}
.seo-preview .spv-title{color:#1a0dab;font-size:1.05rem;margin:6px 0 3px;line-height:1.3;}
.seo-preview .spv-desc{font-size:.85rem;color:#4d5156;line-height:1.5;}
.seo-preview .spv-thumb{width:80px;height:80px;border-radius:8px;object-fit:cover;flex:none;}
.seo-btn{display:inline-flex;align-items:center;gap:5px;}
.modal-box .tick{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--gold-light),var(--gold));display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 12px 30px -10px rgba(122,90,44,.6);}
.modal-box .tick svg{width:30px;height:30px;stroke:var(--teal);stroke-width:3;fill:none;}
.modal-box h3{margin-bottom:12px;}
.modal-box p{color:var(--charcoal-soft);font-size:.94rem;line-height:1.6;margin-bottom:24px;}

/* ---------- confirm modal (delete / sign-out) ---------- */
.confirm-modal-box{max-width:380px;}
.confirm-modal-box .warn-icon{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;animation:confirmPop .5s cubic-bezier(.34,1.56,.64,1);}
.confirm-modal-box .warn-icon.danger{background:linear-gradient(135deg,#e2a48f,#b93b26 60%,#7c2414);box-shadow:0 12px 30px -10px rgba(139,40,20,.55);}
.confirm-modal-box .warn-icon.neutral{background:linear-gradient(135deg,var(--gold-light),var(--gold));box-shadow:0 12px 30px -10px rgba(122,90,44,.6);}
.confirm-modal-box .warn-icon svg{width:26px;height:26px;stroke:#fff;stroke-width:2.2;fill:none;}
@keyframes confirmPop{0%{transform:scale(.35) rotate(-8deg);opacity:0;}55%{transform:scale(1.14) rotate(2deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
.confirm-btn-row{display:flex;gap:12px;margin-top:6px;}
.confirm-btn-row button{flex:1;justify-content:center;}
.danger-btn{background:linear-gradient(135deg,#d9927c,#b93b26 55%,#7c2414);color:#fff;border:none;padding:13px 20px;border-radius:999px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:8px;box-shadow:0 10px 26px -10px rgba(139,40,20,.6);transition:transform .25s var(--ease),box-shadow .25s var(--ease);cursor:pointer;}
.danger-btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px -8px rgba(139,40,20,.7);}

/* ---------- small luxury polish touches ---------- */
.gold-btn{position:relative;overflow:hidden;}
.gold-btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .65s ease;}
.gold-btn:hover::after{left:130%;}
.team-card .photo{transition:transform .5s var(--ease),box-shadow .5s var(--ease);}
.team-card:hover .photo{transform:translateY(-6px) scale(1.03);box-shadow:0 22px 40px -16px rgba(0,0,0,.45);}
.price-card{transition:transform .4s var(--ease),box-shadow .4s var(--ease);}
.price-card:hover{transform:translateY(-6px);box-shadow:0 22px 48px -20px rgba(15,25,20,.32);}
.toast{display:flex;align-items:center;gap:10px;}
.toast .toast-dot{width:8px;height:8px;border-radius:50%;background:var(--gold-light);flex:none;box-shadow:0 0 8px 2px rgba(222,188,133,.7);}
.toast.err .toast-dot{background:#e2a48f;box-shadow:0 0 8px 2px rgba(226,164,143,.6);}

/* ---------- mission images admin grid ---------- */
.mission-tile{position:relative;border-radius:16px;overflow:hidden;height:150px;}
.mission-tile img{width:100%;height:100%;object-fit:cover;}
.mission-tile .mission-tools{position:absolute;inset:0;background:rgba(15,12,8,.55);opacity:0;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .25s;}
.mission-tile:hover .mission-tools{opacity:1;}
.mission-add-tile{border:2px dashed rgba(180,135,74,.5);border-radius:16px;height:150px;display:flex;align-items:center;justify-content:center;color:var(--gold-deep);font-weight:600;font-size:.85rem;background:rgba(180,135,74,.06);}

/* ---------- admin settings form ---------- */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:640px){.settings-grid{grid-template-columns:1fr;}}
.hidden-file-input{position:fixed;top:-9999px;left:-9999px;}

/* ================= ADDED: intro splash (logo + luxury reveal) ================= */
#introSplash{position:fixed;inset:0;z-index:6000;background:radial-gradient(circle at 50% 38%,var(--teal-light) 0%,var(--charcoal) 72%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .8s var(--ease),visibility .8s var(--ease);}
#introSplash.hide{opacity:0;visibility:hidden;pointer-events:none;}
#introSplash .splash-logo-wrap{position:relative;width:118px;height:118px;display:flex;align-items:center;justify-content:center;}
#introSplash .splash-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(222,188,133,.35);animation:splashRing 2.3s var(--ease) infinite;}
#introSplash .splash-ring.r2{animation-delay:.55s;}
#introSplash .splash-logo{width:82px;height:82px;object-fit:contain;opacity:0;transform:scale(.7);animation:splashLogoIn 1.1s var(--ease) .2s forwards;filter:drop-shadow(0 8px 22px rgba(180,135,74,.5));border-radius:50%;background:#fff;padding:10px;}
#introSplash .splash-name{font-family:'Cormorant Garamond',serif;color:var(--gold-light);font-size:1.5rem;letter-spacing:.05em;opacity:0;transform:translateY(10px);animation:splashTextIn .9s var(--ease) .9s forwards;text-align:center;}
#introSplash .splash-tag{font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:rgba(236,226,205,.55);opacity:0;transform:translateY(8px);animation:splashTextIn .9s var(--ease) 1.15s forwards;text-align:center;}
#introSplash .splash-sweep{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
#introSplash .splash-sweep::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(222,188,133,.13),transparent);animation:splashSweepMove 2.4s ease-in-out infinite;}
@keyframes splashRing{0%{transform:scale(.85);opacity:.9;}100%{transform:scale(1.85);opacity:0;}}
@keyframes splashLogoIn{0%{opacity:0;transform:scale(.7);}100%{opacity:1;transform:scale(1);}}
@keyframes splashTextIn{to{opacity:1;transform:translateY(0);}}
@keyframes splashSweepMove{0%{left:-50%;}100%{left:120%;}}
@media(prefers-reduced-motion:reduce){
  #introSplash .splash-ring,#introSplash .splash-sweep::after{animation:none;}
  #introSplash .splash-logo,#introSplash .splash-name,#introSplash .splash-tag{animation:none;opacity:1;transform:none;}
}

/* ================= ADDED: draggable / reorderable sections (admin edit mode only) ================= */
.admin-section{display:contents;}
body.admin-edit-mode .admin-section{display:block;position:relative;}
body.admin-edit-mode .admin-section.dragging{opacity:.35;}
body.admin-edit-mode .admin-section.drag-over-top{box-shadow:inset 0 4px 0 0 var(--gold);}
body.admin-edit-mode .admin-section.drag-over-bottom{box-shadow:inset 0 -4px 0 0 var(--gold);}
.sec-toolbar{position:sticky;top:6px;z-index:80;display:flex;gap:8px;align-items:center;justify-content:center;width:max-content;margin:0 auto;background:rgba(26,22,17,.92);padding:6px 8px 6px 4px;border-radius:999px;backdrop-filter:blur(6px);box-shadow:0 8px 22px -10px rgba(0,0,0,.55);}
.sec-toolbar .admin-mini-btn{background:#fff;}
.sec-drag{cursor:grab;color:var(--gold-light);font-size:1.05rem;line-height:1;padding:3px 8px;user-select:none;}
.sec-drag:active{cursor:grabbing;}
.add-section-bar{display:flex;justify-content:center;padding:34px 0;}
.add-section-bar .admin-mini-btn{padding:10px 20px;font-size:.8rem;border-radius:999px;}

/* ================= ADDED: entrance-animation modifiers (reuse existing .reveal engine) ================= */
.reveal.anim-zoom{transform:scale(.84);}
.reveal.anim-zoom.in{transform:scale(1);}
.reveal.anim-left{transform:translateX(-56px);}
.reveal.anim-left.in{transform:translateX(0);}
.reveal.anim-right{transform:translateX(56px);}
.reveal.anim-right.in{transform:translateX(0);}

/* ================= ADDED: background theme options for sections / custom blocks ================= */
section.cb-theme-cream{background:var(--cream);color:var(--charcoal);}
section.cb-theme-ivory{background:var(--ivory);color:var(--charcoal);}
section.cb-theme-gold{background:linear-gradient(160deg,rgba(222,188,133,.25),rgba(180,135,74,.08));color:var(--charcoal);}
section.cb-theme-dark{background:linear-gradient(160deg,var(--teal),#0b0906);color:#f4efe1;}
section.cb-theme-dark h2,section.cb-theme-dark h3,section.cb-theme-dark h4{color:#fff;}
section.cb-section{padding:78px 0;}

/* ================= ADDED: subtle grain texture for otherwise-plain sections (matches the same
   noise already used in the hero/reviews/footer) — no colour glow, kept very light on purpose. */
.grain{position:relative;overflow:hidden;}
.grain::before{
  content:'';position:absolute;inset:0;
  background-color:rgba(122,90,44,.05);
  background-image:var(--noise);
  background-blend-mode:overlay;
  background-size:150px;
  opacity:.55;
  pointer-events:none;
}
.grain > .wrap{position:relative;z-index:1;} /* keeps real content above the texture layer, same stacking approach the hero section already uses */

/* ================= ADDED: rich-text floating toolbar ================= */
.rte-toolbar{position:fixed;z-index:4500;display:none;gap:2px;background:#1c1712;border-radius:10px;padding:5px;box-shadow:0 14px 34px -10px rgba(0,0,0,.55);align-items:center;flex-wrap:nowrap;max-width:95vw;overflow-x:auto;}
.rte-toolbar.show{display:flex;}
.rte-toolbar button{background:transparent;border:1px solid transparent;color:#ECE2CD;border-radius:6px;font-size:.78rem;padding:6px 9px;white-space:nowrap;font-weight:700;}
.rte-toolbar button:hover,.rte-toolbar button.active{background:rgba(222,188,133,.2);border-color:rgba(222,188,133,.4);color:#DEBC85;}
.rte-toolbar select{background:#2a231a;color:#ECE2CD;border:1px solid rgba(222,188,133,.3);border-radius:6px;font-size:.76rem;padding:5px 6px;max-width:118px;}
.rte-toolbar .rte-sep{width:1px;align-self:stretch;background:rgba(255,255,255,.15);margin:0 3px;}
.rte-toolbar input[type=color]{width:26px;height:26px;padding:0;border:none;border-radius:6px;background:none;cursor:pointer;}
[data-bind][data-rich]{outline:1.5px dashed var(--gold);outline-offset:6px;border-radius:6px;}
[data-bind][data-rich] a{text-decoration:underline;text-decoration-color:var(--gold-deep);}
[data-rich] > p,[data-rich] > div{margin:0 0 12px;}
[data-rich] > p:last-child,[data-rich] > div:last-child{margin-bottom:0;}

/* ================= ADDED: image editor (crop + entrance animation picker) ================= */
.img-editor-stage{position:relative;max-width:100%;margin:0 auto 16px;background:#111;border-radius:12px;overflow:hidden;touch-action:none;user-select:none;line-height:0;}
.img-editor-stage img{display:block;max-width:100%;max-height:50vh;margin:0 auto;pointer-events:none;}
.crop-box{position:absolute;border:2px solid var(--gold-light);box-shadow:0 0 0 1500px rgba(0,0,0,.5);cursor:move;}
.crop-handle{position:absolute;width:15px;height:15px;background:var(--gold-light);border:2px solid #1a1611;border-radius:50%;}
.crop-handle.nw{top:-8px;left:-8px;cursor:nwse-resize;}
.crop-handle.ne{top:-8px;right:-8px;cursor:nesw-resize;}
.crop-handle.sw{bottom:-8px;left:-8px;cursor:nesw-resize;}
.crop-handle.se{bottom:-8px;right:-8px;cursor:nwse-resize;}
.img-editor-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
.img-editor-row label{font-size:.78rem;font-weight:600;color:var(--charcoal-soft);}
.img-editor-row select{border:1px solid rgba(180,135,74,.4);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:.85rem;background:#fff;}

/* ================= ADDED: add-section block library ================= */
.block-lib-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px;}
.block-lib-card{border:1.5px solid rgba(180,135,74,.35);border-radius:14px;padding:16px 12px;text-align:center;background:#fff;transition:transform .25s,box-shadow .25s;cursor:pointer;}
.block-lib-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px -14px rgba(122,90,44,.5);border-color:var(--gold);}
.block-lib-card .bl-ico{font-size:1.6rem;margin-bottom:8px;}
.block-lib-card b{display:block;font-size:.88rem;margin-bottom:4px;color:var(--teal);}
.block-lib-card span{font-size:.72rem;color:var(--charcoal-soft);line-height:1.4;display:block;}
/* ================= DPEN AI CHAT ================= */
#dpenRoot{--dpen-db:22px;--dpen-mb:16px;--dpen-extra:0px;--dpen-side:22px;font-family:'Manrope',sans-serif;}
#dpenRoot[hidden],#dpenRoot [hidden]{display:none!important;}
body.dpen-admin-bar #dpenRoot{--dpen-extra:64px;}
body.dpen-on .toast{bottom:104px;}
body.dpen-admin-bar.dpen-on .toast{bottom:168px;}
.dpen-fab,.dpen-tip,.dpen-win{position:fixed;z-index:2900;}
.dpen-fab{bottom:calc(var(--dpen-db) + var(--dpen-extra));display:flex;align-items:center;gap:10px;background:var(--charcoal);color:#fff;border:1px solid rgba(222,188,133,.55);border-radius:999px;padding:8px 18px 8px 8px;box-shadow:0 18px 40px -12px rgba(10,8,6,.55);cursor:pointer;transition:transform .2s var(--ease);}
.dpen-fab:hover{transform:translateY(-2px);}

/* ===================== STORAGE HELPERS (Firestore-backed) ===================== */
async function loadJSON(key, shared, fallback){
  try{
    const snap = await getDoc(doc(fsdb, "sitedata", key));
    return snap.exists() ? snap.data().value : fallback;
  }catch(e){ console.error("loadJSON failed for", key, e); return fallback; }
}
async function saveJSON(key, shared, value){
  try{
    await setDoc(doc(fsdb, "sitedata", key), {value});
    return true;
  }catch(e){ console.error("saveJSON failed for", key, e); return false; }
}

let DB = JSON.parse(JSON.stringify(DEFAULT_DB));
// Only the CURRENTLY signed-in real user's own profile is ever loaded/cached —
// never a list of everyone, to keep other users' name/phone/email private.
let MY_PROFILE = null;
let APPOINTMENTS = [];           // lazy-loaded, admin-only (each is its own Firestore doc)
let PATIENT_VOICES = [];         // lazy-loaded, admin-only (all reviews, for moderation)
let MY_VOICES = {uid:null, list:[]}; // lazy-loaded, current user's own submitted reviews
let MY_APPTS = {uid:null, list:[]};   // lazy-loaded, current user's own appointments (only if booked while signed in)
let NEWS_COMMENTS = {};          // newsId -> [{id,name,uid,text,date,guest}], lazy-loaded
let NEWS_LIKES = {};             // newsId -> {count, uids:Set}, lazy-loaded
let NEWS_VIEWS = {};             // newsId -> count, lazy-loaded (live view counter, separate from the admin-editable base number)
let apptsLoaded = false, allVoicesLoaded = false, commentsLikesLoaded = false;
let SESSION = null; // {uid, email} — populated from Firebase Auth
let authReady = false; // true once Firebase has resolved the initial auth state at least once

let editMode = false;
let toastTimer = null;

/* ADDED: if the page loads with a hash that doesn't match any real route (e.g. a stale
   shared link, or a hosting redirect quirk), land on the home page instead of a dead-end
   "Page not found" right after the intro animation. In-app navigation to a genuinely broken
   link later in the session still shows the normal "Page not found" page as before. */
const KNOWN_ROUTE_KEYS = new Set(["services","service","pricing","about","news","book","privacy","terms","login","signup","dashboard"]);

/* ===================== BOOTSTRAP ===================== */
async function boot(){
  redirectLegacyHash(); // purano /#/services jasto link lai /services ma (Phase 3)
  let merged = null;
  let needsMigrationWrite = false;
  const coreSnap = await getDoc(doc(fsdb,"sitedata","core")).catch(()=>null);
  if(coreSnap && coreSnap.exists()){
    const core = coreSnap.data().value;
    if(core.itemIndex){
      merged = await loadSplitDB(core); // current per-item format
    } else {
      merged = await loadLegacySplitDB(core); // previous whole-array-per-section format — migrate forward
      needsMigrationWrite = true;
    }
  } else {
    // No split structure at all yet — fall back to the very first single "sitedata/sitedata"
    // document (pre-migration real data), or null if this is a genuinely brand-new site.
    const oldSnap = await getDoc(doc(fsdb,"sitedata","sitedata")).catch(()=>null);
    merged = (oldSnap && oldSnap.exists()) ? oldSnap.data().value : null;
    needsMigrationWrite = true;
  }
  DB = normalizeDB(merged);
  if(needsMigrationWrite) await persistDB();
  // Update static og:image/twitter:image from saved ogImageUrl if set (public URL for social bots)
  const savedOgUrl = DB.siteInfo.seo && DB.siteInfo.seo.ogImageUrl;
  if(savedOgUrl){
    const ogImg = document.querySelector('meta[property="og:image"]');
    const twImg = document.querySelector('meta[name="twitter:image"]');
    if(ogImg) ogImg.content = savedOgUrl;
    if(twImg) twImg.content = savedOgUrl;
  }
  if(DB.siteInfo.emailjs && DB.siteInfo.emailjs.publicKey && window.emailjs){
    try{ emailjs.init({publicKey:DB.siteInfo.emailjs.publicKey}); }catch(e){}
  }
  onAuthStateChanged(fbAuth, async (user)=>{
    if(user && !user.isAnonymous){
      try{
        const ref = doc(fsdb,"users",user.uid);
        const snap = await getDoc(ref);
        if(snap.exists()){
          MY_PROFILE = snap.data();
        } else if(user.uid === ADMIN_UID){
          // First-ever admin login: seed the admin's own profile doc.
          MY_PROFILE = {email:user.email||"admin@neupanedental.com.np", phone:"", name:"Clinic Admin"};
          try{ await setDoc(ref, MY_PROFILE); }catch(e){}
        } else {
          MY_PROFILE = null;
        }
      }catch(e){ MY_PROFILE = null; }
    } else {
      MY_PROFILE = null;
    }
    SESSION = user ? {uid:user.uid, email:user.email, isAnonymous:!!user.isAnonymous} : null;
    authReady = true;
    render();
  });
  /* Phase 3: path routing — browser ko back/forward */
  window.addEventListener("popstate", ()=>{ ROUTE = location.pathname || "/"; render(); window.scrollTo({top:0,behavior:"smooth"}); });
  /* Purano "#/..." hash aayo bhane (jastai Firestore ma save bhayeko link) path ma badalne */
  window.addEventListener("hashchange", ()=>{ if(location.hash.startsWith("#/")) navigate(location.hash, {replace:true}); });
  /* Site bhitra ka link: page reload nagari navigate() */
  document.addEventListener("click", handleInternalLinkClick);

  /* ---------- mobile drawer wiring ---------- */
  document.addEventListener("keydown",(e)=>{
    if(e.key==="Escape") closeMobileNav();
    if(e.key==="Enter" && e.target.id==="seoKwInput"){ e.preventDefault(); addSeoKeyword(e.target.value); e.target.value=""; }
  });
  document.addEventListener("click",(e)=>{
    if(e.target.closest("#mobileDrawerLinks a")) closeMobileNav();
  });
  document.addEventListener("input",(e)=>{
    if(e.target.id==="mobileNavSearch"){
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll("#mobileDrawerLinks a").forEach(a=>{
        const match = !q || (a.dataset.label||"").includes(q);
        a.classList.toggle("no-match", !match);
      });
      return;
    }
    if(e.target.id==="seoTitleInput"){ seoDraft.title = e.target.value; refreshSeoPreview(); return; }
    if(e.target.id==="seoDescInput"){ seoDraft.description = e.target.value; refreshSeoDescWarn(); refreshSeoPreview(); return; }
    if(e.target.id==="seoKwInput"){ return; }
  });
  ROUTE = location.pathname || "/"; // unknown route bhaye pageContent() le "Page not found" dekhaucha (Worker le 404 dinchha)
  render();
}
function normalizeDB(db){
  if(!db) return JSON.parse(JSON.stringify(DEFAULT_DB));
  db.siteInfo = Object.assign({}, DEFAULT_DB.siteInfo, db.siteInfo||{});
  db.siteInfo.emailjs = Object.assign({}, DEFAULT_DB.siteInfo.emailjs, db.siteInfo.emailjs||{});
  db.siteInfo.seo = Object.assign({}, DEFAULT_DB.siteInfo.seo, db.siteInfo.seo||{});
  db.siteInfo.adsense = Object.assign({}, DEFAULT_DB.siteInfo.adsense, db.siteInfo.adsense||{});
  db.siteInfo.dpen = Object.assign({}, DEFAULT_DB.siteInfo.dpen, db.siteInfo.dpen||{});
  if(!db.siteInfo.privacyContent) db.siteInfo.privacyContent = DEFAULT_DB.siteInfo.privacyContent;
  if(!db.siteInfo.termsContent) db.siteInfo.termsContent = DEFAULT_DB.siteInfo.termsContent;
  db.seoPages = Object.assign({}, DEFAULT_DB.seoPages, db.seoPages||{});
  if(!Array.isArray(db.siteInfo.missionImages) || !db.siteInfo.missionImages.length) db.siteInfo.missionImages = DEFAULT_DB.siteInfo.missionImages.slice();
  if(!Array.isArray(db.siteInfo.galleryImages) || !db.siteInfo.galleryImages.length) db.siteInfo.galleryImages = DEFAULT_DB.siteInfo.galleryImages.slice();
  db.team = db.team && db.team.length ? db.team : DEFAULT_DB.team;
  db.services = db.services && db.services.length ? db.services : DEFAULT_DB.services;
  db.news = db.news && db.news.length ? db.news : DEFAULT_DB.news;
  db.reviews = db.reviews && db.reviews.length ? db.reviews : DEFAULT_DB.reviews;
  db.faqsGlobal = db.faqsGlobal && db.faqsGlobal.length ? db.faqsGlobal : DEFAULT_DB.faqsGlobal;
  if(db.siteInfo.copyrightText) db.siteInfo.copyrightText = db.siteInfo.copyrightText.replace(/^(©\s*\d{4}\s*)+/,"").trim() || DEFAULT_DB.siteInfo.copyrightText;
  if(!Array.isArray(db.siteInfo.branches)) db.siteInfo.branches = [];
  (db.services||[]).forEach(sv=>{

    if(Array.isArray(sv.priceList)) sv.priceList = sv.priceList.map(p=> Array.isArray(p) ? {label:p[0],price:p[1]} : p);
    if(sv.price) sv.price = sv.price.replace(/^(From\s*)+/i,"").trim();

  });
  (db.news||[]).forEach(n=>{ if(!n.seo) n.seo = {title:"",description:"",keywords:[],image:""}; });
  Object.keys(DEFAULT_DB.seoPages).forEach(pk=>{ if(!db.seoPages[pk]) db.seoPages[pk] = {title:"",description:"",keywords:[],image:""}; else { db.seoPages[pk].keywords = db.seoPages[pk].keywords||[]; db.seoPages[pk].image = db.seoPages[pk].image||""; } });
  if(!Array.isArray(db.customBlocks)) db.customBlocks = [];
  if(!Array.isArray(db.siteInfo.homeSectionOrder) || !db.siteInfo.homeSectionOrder.length) db.siteInfo.homeSectionOrder = DEFAULT_DB.siteInfo.homeSectionOrder.slice();
  DEFAULT_DB.siteInfo.homeSectionOrder.forEach(id=>{ if(!db.siteInfo.homeSectionOrder.includes(id)) db.siteInfo.homeSectionOrder.push(id); });
  db.customBlocks.forEach(b=>{ const key="custom:"+b.id; if(!db.siteInfo.homeSectionOrder.includes(key)) db.siteInfo.homeSectionOrder.push(key); });

  if(!db.siteInfo.imageAnims || typeof db.siteInfo.imageAnims!=="object") db.siteInfo.imageAnims = {};

}
/* ===================== ADDED: site data split across many per-item Firestore documents =====================
   Each team member, service, news post and custom block now lives in its OWN document (using its
   existing stable `id`), instead of sharing one document per section. This means one bloated
   service's photo can never block ANY other service, team member, news post, or a plain text edit
   from saving — every item gets its own independent ~1MB budget. A small "core" document keeps an
   index of which ids currently exist so loading knows what to fetch. */
const SEO_PAGE_KEYS = ["home","services","pricing","about","news","book","privacy","terms"];
function splitDBForSave(){
  const { missionImages, galleryImages, ...restSiteInfo } = DB.siteInfo;
  /* ADDED: guarantees every item has a stable, unique id before it's used as part of a document
     name — protects against two items ever colliding onto the same saved document. */
  const ensureIds = (arr, tag)=>{
    const seen = new Set();
    arr.forEach((item,i)=>{
      if(!item.id || seen.has(item.id)) item.id = tag+"-fallback-"+Date.now()+"-"+i;
      seen.add(item.id);
    });
  };
  ensureIds(DB.team, "team");
  ensureIds(DB.services, "service");
  ensureIds(DB.news, "news");
  ensureIds(DB.customBlocks, "block");
  const itemIndex = {
    team: DB.team.map(x=>x.id),
    services: DB.services.map(x=>x.id),
    news: DB.news.map(x=>x.id),
    customBlocks: DB.customBlocks.map(x=>x.id)
  };
  const docs = [
    {id:"core", label:"site text & settings", value:{siteInfo:restSiteInfo, reviews:DB.reviews, faqsGlobal:DB.faqsGlobal, itemIndex}},
    {id:"missionImages", label:"mission photos", value:{missionImages:missionImages||[]}},
    {id:"galleryImages", label:"gallery photos", value:{galleryImages:galleryImages||[]}}
  ];
  SEO_PAGE_KEYS.forEach(k=> docs.push({id:"seo-"+k, label:"SEO settings for \""+k+"\"", value: DB.seoPages[k] || {title:"",description:"",keywords:[],image:""}}));
  DB.team.forEach(t=> docs.push({id:"team-"+t.id, label:"team member \""+(t.name||t.id)+"\"", value:t}));
  DB.services.forEach(s=> docs.push({id:"service-"+s.id, label:"service \""+(s.name||s.id)+"\"", value:s}));
  DB.news.forEach(n=> docs.push({id:"news-"+n.id, label:"news post \""+(n.title||n.id)+"\"", value:n}));
  DB.customBlocks.forEach(b=> docs.push({id:"customblock-"+b.id, label:"custom section", value:b}));
  return docs;
}
async function loadSplitDB(core){
  const idx = core.itemIndex || {team:[],services:[],news:[],customBlocks:[]};
  const fetchEach = (prefix, ids)=> Promise.all(ids.map(id=> getDoc(doc(fsdb,"sitedata",prefix+id)).catch(()=>null)));
  const [missionSnap, gallerySnap, seoSnaps, teamSnaps, serviceSnaps, newsSnaps, blockSnaps] = await Promise.all([
    getDoc(doc(fsdb,"sitedata","missionImages")).catch(()=>null),
    getDoc(doc(fsdb,"sitedata","galleryImages")).catch(()=>null),
    fetchEach("seo-", SEO_PAGE_KEYS),
    fetchEach("team-", idx.team||[]),
    fetchEach("service-", idx.services||[]),
    fetchEach("news-", idx.news||[]),
    fetchEach("customblock-", idx.customBlocks||[])
  ]);
  let missionImages, galleryImages;
  if((missionSnap && missionSnap.exists()) || (gallerySnap && gallerySnap.exists())){
    missionImages = (missionSnap && missionSnap.exists()) ? (missionSnap.data().value.missionImages||[]) : [];
    galleryImages = (gallerySnap && gallerySnap.exists()) ? (gallerySnap.data().value.galleryImages||[]) : [];
  } else {
    // Not split yet — fall back to the older combined "coreImages" document (migrated forward on next save).
    const coreImagesSnap = await getDoc(doc(fsdb,"sitedata","coreImages")).catch(()=>null);
    const coreImages = (coreImagesSnap && coreImagesSnap.exists()) ? coreImagesSnap.data().value : {};
    missionImages = coreImages.missionImages||[];
    galleryImages = coreImages.galleryImages||[];
  }
  let seoPages = {};
  const anySeoSplit = seoSnaps.some(s=>s&&s.exists());
  if(anySeoSplit){
    SEO_PAGE_KEYS.forEach((k,i)=>{ seoPages[k] = (seoSnaps[i]&&seoSnaps[i].exists()) ? seoSnaps[i].data().value : {title:"",description:"",keywords:[],image:""}; });
  } else {
    // Not split yet — fall back to seoPages still embedded in "core" (migrated forward on next save).
    seoPages = core.seoPages || {};
  }
  return {
    siteInfo: Object.assign({}, core.siteInfo, { missionImages, galleryImages }),
    seoPages, reviews: core.reviews, faqsGlobal: core.faqsGlobal,
    team: teamSnaps.filter(s=>s&&s.exists()).map(s=>s.data().value),
    services: serviceSnaps.filter(s=>s&&s.exists()).map(s=>s.data().value),
    news: newsSnaps.filter(s=>s&&s.exists()).map(s=>s.data().value),
    customBlocks: blockSnaps.filter(s=>s&&s.exists()).map(s=>s.data().value)
  };
}

   "customBlocks") so existing sites migrate forward automatically the first time this loads. */
async function loadLegacySplitDB(core){

async function persistDB(){
  const docs = splitDBForSave();
  let allOk = true, firstErrorMsg = "";
  for(const {id, label, value} of docs){
    try{
      const approxBytes = new Blob([JSON.stringify(value)]).size;
      if(approxBytes > 900000){
        allOk = false;
        if(!firstErrorMsg) firstErrorMsg = `Could not save the ${label} — its content is too large (over ~900KB). Replace or remove a photo there, then try again.`;
        continue;
      }
    }catch(e){ /* size check itself failing shouldn't block the save attempt */ }
    try{
      await setDoc(doc(fsdb, "sitedata", id), {value});
    }catch(e){
      console.error("persistDB failed for", id, e);
      allOk = false;
      if(!firstErrorMsg){
        const code = e && e.code;
        const msgText = String((e && e.message) || "");
        if(code==="permission-denied") firstErrorMsg = "Could not save — you're not signed in as admin, or your session expired. Please sign in again.";
        else if(code==="unavailable" || code==="deadline-exceeded") firstErrorMsg = "Could not save — network connection issue. Check your internet and try again.";
        else if(code==="resource-exhausted") firstErrorMsg = "Could not save — Firebase usage limit reached. Please try again shortly.";
        else if(code==="invalid-argument" || /longer than|exceeds|too large|maximum/i.test(msgText)) firstErrorMsg = `Could not save the ${label} — its content is too large (likely a photo). Replace or remove a photo there, then try again.`;
        else firstErrorMsg = `Could not save the ${label} — check your connection or admin sign-in.`;
      }
    }
  }
  if(!allOk){
    showToast(firstErrorMsg || "Could not save — check your connection, admin sign-in, or try a smaller/fewer photo.", true);
    __pdbToastShown = true;
  }
  if(allOk) scheduleSeoCachePurge();
  return allOk;
}

   Admin login bhayeko bela matra; dherai Save lagatar bhaye ek choti matra pathaucha. Fail bhaye site lai kehi asar gardaina. */

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
/* ===================== ADDED: rich-text sanitizer (used for admin-formatted paragraphs) ===================== */
const RICH_ALLOWED_TAGS = new Set(["B","STRONG","I","EM","U","S","STRIKE","SPAN","BR","P","DIV","A","MARK","UL","OL","LI"]);
const RICH_ALLOWED_ATTRS = {A:["href","target","rel"], SPAN:["style"], P:["style"], DIV:["style"], MARK:["style"]};
/* Content pasted from Word/Google Docs commonly carries an inline background-color:white (or
   near-white) on paragraphs/spans, which shows up as a stray white box against this site's cream
   background. Strip ONLY white/near-white background-colors; a genuine highlight color chosen via
   the toolbar (yellow, etc.) is untouched. */
function isNearWhiteColor(val){
  const v = String(val).trim().toLowerCase();
  if(v==="white" || v==="#fff" || v==="#ffffff") return true;
  let m = v.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/);
  if(m){
    let hex = m[1];
    if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
    const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
    return r>=248 && g>=248 && b>=248;
  }
  m = v.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+)\s*)?\)$/);
  if(m){
    const r=+m[1], g=+m[2], b=+m[3];
    const a = m[4]!==undefined ? +m[4] : 1;
    return r>=248 && g>=248 && b>=248 && a>0.4;
  }
  return false;
}
function sanitizeRichHTML(html){
  const tmp = document.createElement("div");
  tmp.innerHTML = html==null ? "" : String(html);
  (function walk(node){
    Array.from(node.childNodes).forEach(child=>{
      if(child.nodeType===1){
        const tag = child.tagName;
        if(!RICH_ALLOWED_TAGS.has(tag)){
          while(child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          return;
        }
        const allowed = RICH_ALLOWED_ATTRS[tag]||[];
        Array.from(child.attributes).forEach(attr=>{ if(!allowed.includes(attr.name)) child.removeAttribute(attr.name); });
        if(tag==="A"){
          let href = child.getAttribute("href")||"";
          if(!/^https?:\/\//i.test(href) && !href.startsWith("#") && !href.startsWith("/")) href = "#";
          child.setAttribute("href", href);
          child.setAttribute("rel","noopener");
        }
        if(tag==="SPAN"||tag==="P"||tag==="DIV"||tag==="MARK"){
          const style = child.getAttribute("style")||"";
          const safe = style.split(";").map(x=>x.trim()).filter(x=>{
            const m = x.match(/^(color|background-color|font-family|font-size|text-align|font-weight|font-style|text-decoration)\s*:\s*(.+)$/i);
            if(!m) return false;
            if(m[1].toLowerCase()==="background-color" && isNearWhiteColor(m[2])) return false;
            return true;
          }).join(";");
          if(safe) child.setAttribute("style", safe); else child.removeAttribute("style");
        }
        walk(child);
      } else if(child.nodeType===8){ node.removeChild(child); }
    });
  })(tmp);
  return tmp.innerHTML;
}
function richOut(v){ return sanitizeRichHTML(v==null?"":String(v)); }
function initials(name){ return (name||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function fmtDate(d){ try{ return new Date(d).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}); }catch(e){ return d; } }

/* ===================== REVEAL / SCROLL FX ===================== */
function initScrollFx(){
  document.querySelectorAll(".reveal").forEach(el=>{
    if(el.__obs) return;
    const io = new IntersectionObserver(entries=>{
      entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
    },{threshold:.15});
    io.observe(el); el.__obs = true;
  });
  const header = document.getElementById("siteHeader");
  if(header && typeof window.__lastScrollY!=="number") window.__lastScrollY = window.scrollY;
  if(!window.__scrollFxBound){
    window.__scrollFxBound = true;
    let ticking = false;
    window.addEventListener("scroll", ()=>{
      if(ticking) return;
      ticking = true;
      requestAnimationFrame(()=>{
        const h = document.getElementById("siteHeader");
        if(h){
          const y = window.scrollY;
          h.classList.toggle("scrolled", y>10);
          const drawerOpen = document.getElementById("mobileDrawer")?.classList.contains("open");
          if(!drawerOpen){
            if(y > window.__lastScrollY && y > 60){ h.classList.add("nav-hidden"); }
            else if(y < window.__lastScrollY - 2 || y<=60){ h.classList.remove("nav-hidden"); }
          }
          window.__lastScrollY = y;
        }
        ticking = false;
      });
    }, {passive:true});
  }
}

function seoMetaEl(attr, val){
  let el = document.querySelector(`meta[${attr}="${val}"]`);
  if(!el){ el = document.createElement("meta"); el.setAttribute(attr, val); document.head.appendChild(el); }
  return el;
}
function setMetaName(name, content){ seoMetaEl("name", name).setAttribute("content", content||""); }
function setMetaProp(prop, content){ seoMetaEl("property", prop).setAttribute("content", content||""); }
function applyAdsense(){
  const ads = (DB.siteInfo && DB.siteInfo.adsense) || {};
  const pubId = (ads.publisherId||"").trim();

  let meta = document.getElementById("adsenseMeta");
  let script = document.getElementById("adsenseScript");

  if(!pubId){
    if(meta) meta.remove();
    if(script) script.remove();
    return;
  }

  if(!meta){ meta = document.createElement("meta"); meta.id="adsenseMeta"; meta.name="google-adsense-account"; document.head.appendChild(meta); }
  meta.setAttribute("content", pubId);

  if(!script || script.dataset.pub !== pubId){
    if(script) script.remove();
    script = document.createElement("script");
    script.id = "adsenseScript"; script.async = true; script.crossOrigin = "anonymous";
    script.dataset.pub = pubId;
    script.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${encodeURIComponent(pubId)}`;
    document.head.appendChild(script);
  }
}
function generateAdsTxtLine(){

}

function setCanonical(href){

/* Phase 4: Worker (Cloudflare) sanga ekai niyam — SITE_ORIGIN, photo ko kram, base64 → /og/... */
const SITE_ORIGIN = "https://www.neupanedental.com.np";
function seoHashStr(s){ let h = 0x811c9dc5; const step = Math.max(1, Math.floor(s.length/4096)); for(let i=0;i<s.length;i+=step){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } h ^= s.length; return (h>>>0).toString(36); }
function seoResolveImage(img, ogPath){
  if(!img || typeof img!=="string") return "";
  if(img.startsWith("data:image/")){
    const mime = (img.slice(5, img.indexOf(";"))||"image/jpeg").toLowerCase();
    const ext = ({"image/jpeg":"jpg","image/jpg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif"})[mime] || "jpg";
    return `${SITE_ORIGIN}${ogPath}.${ext}?v=${seoHashStr(img)}`;
  }
  if(/^https?:\/\//i.test(img)) return img;
  if(img.startsWith("/")) return SITE_ORIGIN + img;
  return "";
}
/* Worker ko isKnownRouteShape() jastai — chinne URL ko akar */
function seoKnownRouteShape(parts){
  if(parts.length===0) return true;
  const p0 = parts[0];
  if(["services","pricing","about","book","privacy","terms","login","signup","dashboard"].includes(p0)) return parts.length===1;
  if(p0==="service") return parts.length===2;
  if(p0==="news"){ if(parts[1]==="cat") return parts.length===3 && ["news","success"].includes(parts[2]); return parts.length<=2; }
  return false;
}
function applySEO(){
  const seo = (DB.siteInfo && DB.siteInfo.seo) || {};
  const pages = DB.seoPages || {};
  const siteName = "Neupane Dental Clinic";
  const parts = parseRoute();
  const pageKey = parts.length===0 ? "home" : (parts[0]==="service" ? "services" : (parts[0]==="news" ? "news" : parts[0]));
  const pageMeta = pages[pageKey] || {};
  let rawTitle = pageMeta.title || "";
  let desc = pageMeta.description || seo.defaultDescription || "";
  let image = pageMeta.image || "";
  let imageOgPath = image ? "/og/page/"+pageKey : "";
  let keywords = (pageMeta.keywords && pageMeta.keywords.length) ? pageMeta.keywords.join(", ") : (seo.keywords || "");
  let ldType = "website";
  let article = null;
  let notFound = !seoKnownRouteShape(parts);

  if(parts[0]==="service" && parts[1]){
    const sv = DB.services.find(x=>x.id===parts[1]);
    if(!sv) notFound = true;
    else { const s = sv.seo||{}; rawTitle = s.title || sv.name || rawTitle; desc = s.description || sv.short || desc; if(s.image || sv.img){ image = s.image || sv.img; imageOgPath = "/og/service/"+sv.id; } if(s.keywords && s.keywords.length) keywords = s.keywords.join(", "); }
  } else if(parts[0]==="news" && parts[1] && parts[1]!=="cat"){
    const n = DB.news.find(x=>x.id===parts[1]);
    if(!n) notFound = true;
    else { const s = n.seo||{}; rawTitle = s.title || n.title || rawTitle; desc = s.description || n.excerpt || desc; if(s.image || n.img){ image = s.image || n.img; imageOgPath = "/og/news/"+n.id; } if(s.keywords && s.keywords.length) keywords = s.keywords.join(", "); ldType="article"; article = n; }
  }
  // Photo: page/service/news ko aaphnai → Social Share Photo URL → upload gareko Social Share Photo → og-image.jpg
  let ogImage = seoResolveImage(image, imageOgPath);
  if(!ogImage && seo.ogImageUrl) ogImage = seo.ogImageUrl;
  if(!ogImage && seo.ogImage) ogImage = seoResolveImage(seo.ogImage, "/og/site");
  if(!ogImage) ogImage = SITE_ORIGIN + "/og-image.jpg";
  // Title khali bhaye admin ko Default Site Title (Decision A)
  const fullTitle = rawTitle ? withSiteName(rawTitle, siteName) : (seo.defaultTitle || siteName);
  const canonical = SITE_ORIGIN + (parts.length ? "/" + parts.map(encodeURIComponent).join("/") : "/");
  const isPrivate = ["login","signup","dashboard"].includes(parts[0]);
  document.title = fullTitle;
  setMetaName("description", desc || seo.defaultDescription || "");
  setMetaName("keywords", keywords || "");
  setMetaName("robots", (isPrivate || notFound) ? "noindex, nofollow" : "index, follow");
  setCanonical(canonical);
  setMetaProp("og:type", ldType==="article" ? "article" : "website");
  setMetaProp("og:site_name", siteName);
  setMetaProp("og:title", fullTitle);
  setMetaProp("og:description", desc || seo.defaultDescription || "");
  setMetaProp("og:image", ogImage);
  setMetaProp("og:url", canonical);
  setMetaName("twitter:card", "summary_large_image");
  setMetaName("twitter:title", fullTitle);
  setMetaName("twitter:description", desc || seo.defaultDescription || "");
  setMetaName("twitter:image", ogImage);

  let ld;
  if(article){
    ld = {"@context":"https://schema.org","@type":"Article",
      headline: rawTitle, description: desc, image: ogImage,
      datePublished: article.date || undefined, author:{"@type":"Organization",name:siteName},
      publisher:{"@type":"Organization",name:siteName}};
  } else if(pageKey==="home"){
    ld = {"@context":"https://schema.org","@type":"Dentist",
      name:siteName, image: ogImage,
      telephone: DB.siteInfo.phone1 || undefined, email: DB.siteInfo.email || undefined,
      address:{"@type":"PostalAddress",streetAddress:DB.siteInfo.address || undefined},
      url: SITE_ORIGIN + "/"};
  } else {
    ld = {"@context":"https://schema.org","@type":"Organization", name:siteName, url: canonical};
  }
  setJsonLd(ld);
}

/* ===================== ADDED: custom block templates (Add Section library) ===================== */
function renderCustomBlock(block, idx, ed){
  const base = `customBlocks.${idx}`;
  const cls = "cb-section" + (block.theme ? " cb-theme-"+block.theme : "");
  if(block.type==="cta"){
    const btnInner = ed ? `<span data-bind="${base}.btnText" contenteditable="true">${esc(block.btnText)}</span>` : esc(block.btnText);
    const btnHref = ed ? 'href="javascript:void(0)"' : `href="${esc(block.href||'#')}"`;
    return `
    <section class="${cls}">
      <div class="wrap" style="text-align:center;max-width:760px;">
        <h2 class="${revealClassFor(block.anim)}" style="margin-bottom:14px;" ${ed?`data-bind="${base}.title" data-rich="1" contenteditable="true"`:''}>${richOut(block.title)}</h2>
        <div class="${revealClassFor(block.anim)}" style="margin-bottom:26px;" ${ed?`data-bind="${base}.body" data-rich="1" contenteditable="true"`:''}>${richOut(block.body)}</div>
        <div class="${revealClassFor(block.anim)}">
          <a ${btnHref} class="gold-btn">${btnInner}</a>
          ${ed?`<div style="margin-top:12px;"><button type="button" class="admin-mini-btn" data-action="edit-link" data-key="${base}.href">Set Button Link</button></div>`:''}
        </div>
      </div>
    </section>`;
  }
  if(block.type==="text-image"){
    const imgHTML = `<div class="${revealClassFor(block.imgAnim)}" style="position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);">
        <img src="${esc(block.img)}" style="width:100%;height:340px;object-fit:cover;display:block;">
        ${ed?`<div class="mission-tools" style="opacity:1;background:linear-gradient(0deg,rgba(15,12,8,.55),transparent 60%);align-items:flex-end;justify-content:flex-end;padding:14px;">
          <button class="admin-mini-btn" data-action="edit-img" data-path="${base}.img">${icon('upload')} Replace Photo</button>
        </div>`:''}
      </div>`;
    const textHTML = `<div class="${revealClassFor(block.anim)}">
        <h2 style="margin-bottom:14px;" ${ed?`data-bind="${base}.title" data-rich="1" contenteditable="true"`:''}>${richOut(block.title)}</h2>
        <div ${ed?`data-bind="${base}.body" data-rich="1" contenteditable="true"`:''}>${richOut(block.body)}</div>
        ${ed?`<div style="margin-top:14px;"><button type="button" class="admin-mini-btn" data-action="toggle-imgpos" data-sec="${base}">⇄ Swap Photo Side</button></div>`:''}
      </div>`;
    return `
    <section class="${cls}">
      <div class="wrap">
        <div class="grid cols-2" style="align-items:center;gap:50px;">
          ${block.imgPos==='left' ? imgHTML+textHTML : textHTML+imgHTML}
        </div>
      </div>
    </section>`;
  }
  if(block.type==="quote"){
    return `
    <section class="${cls}">
      <div class="wrap" style="max-width:760px;text-align:center;">
        <div class="${revealClassFor(block.anim)}">
          <div style="font-family:'Cormorant Garamond',serif;font-size:2.4rem;color:var(--gold);line-height:1;margin-bottom:10px;">&ldquo;</div>
          <div style="font-size:1.25rem;font-style:italic;line-height:1.7;margin-bottom:18px;" ${ed?`data-bind="${base}.text" data-rich="1" contenteditable="true"`:''}>${richOut(block.text)}</div>
          <b style="display:block;" ${ed?`data-bind="${base}.author" contenteditable="true"`:''}>${esc(block.author)}</b>
          <span style="font-size:.82rem;color:var(--charcoal-soft);" ${ed?`data-bind="${base}.role" contenteditable="true"`:''}>${esc(block.role)}</span>
        </div>
      </div>
    </section>`;
  }
  if(block.type==="gallery-row"){
    const imgs = block.images||[];
    return `
    <section class="${cls}">
      <div class="wrap">
        <div class="grid cols-3" style="gap:18px;">
          ${imgs.map((im,i)=>{
            const rc = revealClassFor((block.imagesAnim&&block.imagesAnim[i])||'up');
            return `<div class="${rc}" style="position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);">
              <img src="${esc(im)}" style="width:100%;height:220px;object-fit:cover;display:block;">
              ${ed?`<div class="mission-tools">
                <button class="admin-mini-btn" data-action="edit-img" data-path="${base}.images.${i}" title="Replace">${icon('upload')}</button>
                <button class="admin-mini-btn danger" data-action="del-block-img" data-sec="${base}" data-idx="${i}" title="Remove">✕</button>
              </div>`:''}
            </div>`;
          }).join('')}
          ${ed?`<button class="mission-add-tile" data-action="add-block-img" data-sec="${base}" style="border:2px dashed rgba(180,135,74,.5);cursor:pointer;min-height:150px;">${icon('upload')}&nbsp; Add Photo</button>`:''}
        </div>
      </div>
    </section>`;
  }
  return '';
}

function renderSecSettingsHTML(id){

    curTheme = (blk&&blk.theme)||"";

  }
  const themeOpts = isCustom

  const animRow = isCustom ? `

        <option value="none" ${curAnim==='none'?'selected':''}>None</option>

  return `

    <h3 style="margin-bottom:14px;">Section Style</h3>
    <div class="img-editor-row">
      <label>Background</label>

/* ===================== ROUTER ===================== */
function parseRoute(){
  const parts = (location.pathname||"/").split("/").filter(Boolean).map(p=>{ try{ return decodeURIComponent(p); }catch(e){ return p; } });
  return parts;
}
/* Phase 3: "#/book?service=x" → "/book?service=x" */
function legacyHashToPath(h){
  const p = String(h||"").replace(/^#/,"");
  return p.startsWith("/") ? p : "/"+p;
}
/* Page khulda URL ma purano "#/..." chha bhane turuntai sahi path ma replace garne */
function redirectLegacyHash(){
  if(location.hash.startsWith("#/")) history.replaceState(null, "", legacyHashToPath(location.hash));
}
/* Pahila ko "location.hash = ..." ko satta. Hashchange jastai render pachhi (async) hunchha. */
function navigate(href, opts){
  opts = opts || {};
  let target = String(href||"/");
  if(target.startsWith("#/")) target = legacyHashToPath(target);
  else if(target.startsWith("#")) return;
  else {
    const u = new URL(target, location.href);
    if(u.origin !== location.origin){ location.href = u.href; return; }
    target = (u.hash.startsWith("#/") && u.pathname==="/") ? legacyHashToPath(u.hash) : (u.pathname + u.search);
  }
  if(target === location.pathname + location.search && !location.hash) return;
  if(opts.replace) history.replaceState(null, "", target);
  else history.pushState(null, "", target);
  setTimeout(()=>{ ROUTE = location.pathname || "/"; render(); window.scrollTo({top:0,behavior:"smooth"}); }, 0);
}
/* Site bhitra ko <a> click: reload nagari navigate(). Bahira ko link, naya tab, file (.xml, .jpg ...) ra "#section" jasta link chhoina. */
function handleInternalLinkClick(e){
  if(e.defaultPrevented || e.button!==0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest && e.target.closest("a[href]");
  if(!a) return;
  if((a.getAttribute("target")||"_self") !== "_self" || a.hasAttribute("download")) return;
  const raw = a.getAttribute("href")||"";
  if(raw.startsWith("#") && !raw.startsWith("#/")) return;
  if(/^(mailto|tel|sms|whatsapp|javascript):/i.test(raw)) return;
  let u;
  try{ u = new URL(raw, location.href); }catch(err){ return; }
  if(u.origin !== location.origin) return;
  if(!raw.startsWith("#/") && !(u.hash.startsWith("#/") && u.pathname==="/") && /\.[a-z0-9]{2,5}$/i.test(u.pathname)) return;
  e.preventDefault();
  navigate(raw);
}
function pageContent(){
  const parts = parseRoute();
  if(parts.length===0) return pageHome();
  if(parts[0]==="services" && parts.length===1) return pageServices();

  if(parts[0]==="pricing") return pagePricing();
  if(parts[0]==="about") return pageAbout();
  if(parts[0]==="news" && parts.length===1) return pageNews("all");
  if(parts[0]==="news" && parts[1]==="cat") return pageNews(parts[2]);
  if(parts[0]==="news" && parts[1]) return pageNewsDetail(parts[1]);
  if(parts[0]==="book") return pageBook();
  if(parts[0]==="privacy") return pagePrivacy();
  if(parts[0]==="terms") return pageTerms();

  return `<section class="wrap" style="padding:120px 0;text-align:center;"><h2>Page not found</h2><a href="/" class="ghost-btn">Go Home</a></section>`;
}

/* Jawaf ko text: HTML escape, **bold**, "- " bullet, aaphnai site ko link */
function dpenMd(text){
  const linkify = (s)=> s.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, (u)=>{
    const raw = u.replace(/&amp;/g,"&");
    if(raw.startsWith(SITE_ORIGIN)){ const p = raw.slice(SITE_ORIGIN.length) || "/"; return `<a href="${esc(p)}">${u}</a>`; }
    if(/^https:\/\/(www\.)?google\.[a-z.]+\/maps|^https:\/\/maps\.app\.goo\.gl\//.test(raw)) return `<a href="${esc(raw)}" target="_blank" rel="noopener">Google Maps</a>`;
    return u;
  });
  const inline = (s)=> linkify(esc(s)).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const out = []; let list = null, para = [];
  const flushPara = ()=>{ if(para.length){ out.push(`<p>${para.join("<br>")}</p>`); para = []; } };
  const flushList = ()=>{ if(list){ out.push(`<ul>${list.map(li=>`<li>${li}</li>`).join("")}</ul>`); list = null; } };
  String(text||"").split(/\r?\n/).forEach(line=>{
    const m = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    if(m){ flushPara(); (list = list || []).push(inline(m[1])); }
    else if(!line.trim()){ flushPara(); flushList(); }
    else { flushList(); para.push(inline(line.trim())); }
  });
  flushPara(); flushList();
  return out.join("");
}

  const div = document.createElement("div");

  if(m.role==="user") div.textContent = m.text; else div.innerHTML = dpenMd(m.text);
  body.appendChild(div);
  if(m.chips){ const ch = dpenChipsHtml(); if(ch) body.insertAdjacentHTML("beforeend", ch); }
  dpenScroll();
}
function dpenTyping(on){
  const body = document.getElementById("dpenBody");
  let t = document.getElementById("dpenTyping");
  if(on && !t && body){ body.insertAdjacentHTML("beforeend", `<div class="dpen-typing" id="dpenTyping"><i></i><i></i><i></i></div>`); dpenScroll(); }
  if(!on && t) t.remove();
  const btn = dpen.el && dpen.el.querySelector(".dpen-send");
  if(btn) btn.disabled = !!on;
}
function dpenLang(s){
  if(/[ऀ-ॿ]/.test(s)) return "नेपाली";
  if(/\b(cha|chha|ho|hunchha|huncha|garnu|garne|daat|dat|mero|tapai|kati|parcha|parchha|dukh\w*|ma|ko|lai|ra|kasari|kina|ke)\b/i.test(s)) return "Roman";
  return s ? "English" : "";
}
function dpenLog(d){
  try{
    const rec = Object.assign({ sid:dpen.sid, t:new Date().toISOString(),
      expireAt: Timestamp.fromDate(new Date(Date.now() + DPEN_LOG_DAYS*864e5)), lang: dpenLang(d.q||"") }, d);
    addDoc(collection(fsdb,"chatLogs"), rec).catch(err=>console.warn("chat log failed", err && err.code));
  }catch(e){ /* log nabhaye pani chat chalirahos */ }
}
/* Gemini lai pathaune history: welcome ra error message bahek, lagatar user message jodne */
function dpenHistory(list){
  const out = [];
  list.forEach(m=>{
    if(m.welcome || m.local) return;
    const role = m.role==="user" ? "user" : "model";
    const last = out[out.length-1];
    if(last && last.role===role) last.text += "\n" + m.text; else out.push({role, text:m.text});
  });
  return out;
}
const DPEN_ERR = {
  limit:"Aaja ko lagi dherai prashna bhaisakyo. Thap jankari ko lagi clinic ma phone garnus ya appointment book garnus.",
  disabled:"Dpen ahile uplabdha chhaina. Kripaya clinic ma phone garnus ya appointment book garnus.",
  blocked:"Maaf garnus, yo prashna ko jawaf dina sakina. Arko tarika le sodhnus ya clinic ma phone garnus.",
  busy:"Maaf garnus, ahile jawaf dina sakina. Ek chhin pachhi feri sodhnus, ya clinic ma phone garnus."
};
async function dpenAsk(messages, extra){
  try{
    const r = await fetch("/__chat", {method:"POST", headers:Object.assign({"Content-Type":"application/json"}, (extra&&extra.headers)||{}),
      body: JSON.stringify(Object.assign({sid:dpen.sid, messages}, (extra&&extra.body)||{}))});
    const j = await r.json().catch(()=>({}));
    if(j && j.ok && j.reply) return {reply:j.reply};
    return {error:(j && j.error) || "busy"};
  }catch(e){ return {error:"busy"}; }
}
function dpenSplitBook(reply){
  const book = /\[\[BOOK\]\]/.test(reply);
  return { book, text: reply.replace(/\s*\[\[BOOK\]\]\s*/g," ").trim() };
}
async function dpenSend(){
  const inp = dpen.el.querySelector("#dpenInput");
  const text = inp.value.trim();
  if(!text || dpen.busy) return;
  inp.value = ""; inp.style.height = "auto";
  dpenAdd({role:"user", text});
  dpen.busy = true; dpenTyping(true);
  const res = await dpenAsk(dpenHistory(dpen.msgs));
  dpenTyping(false); dpen.busy = false;
  if(res.reply){
    const {book, text:clean} = dpenSplitBook(res.reply);
    dpenAdd({role:"model", text:clean, chips:book});
    dpenLog({type:"msg", q:text.slice(0,2000), a:clean.slice(0,6000)});
  } else {
    dpenAdd({role:"model", text:DPEN_ERR[res.error] || DPEN_ERR.busy, local:true, chips:true});
    if(res.error==="disabled") setTimeout(()=>{ if(DB.siteInfo.dpen) DB.siteInfo.dpen.enabled = false; }, 0);
  }
  if(!dpenIsMobile()) inp.focus();
}

function dpenGroup(logs){
  const by = {};
  logs.forEach(x=>{ (by[x.sid] = by[x.sid] || []).push(x); });
  return Object.keys(by).map(sid=>{
    const items = by[sid].sort((a,b)=>a.t<b.t?-1:1);
    const msgs = items.filter(x=>x.type==="msg");
    return { sid, items, t:items[0].t, first:(msgs[0]&&msgs[0].q)||"", count:msgs.length,
      lang:(msgs.find(x=>x.lang)||{}).lang||"", booked:items.some(x=>x.type==="booking"), link:items.some(x=>x.type==="link") };
  }).sort((a,b)=>a.t<b.t?1:-1);
}
function dpenHistoryHtml(){

  let convs = dpenGroup(dpenAdm.logs);
  if(q) convs = convs.filter(c=>c.items.some(x=>((x.q||"")+" "+(x.a||"")).toLowerCase().includes(q)));
  if(!convs.length) return `<p class="form-note">Yo din kunai chat chhaina.</p>`;
  return `<table><tr><th>Samaya</th><th>Pahilo prashna</th><th>Message</th><th>Bhasha</th><th>Booking</th><th></th></tr>

      <td>${cv.count}</td><td>${esc(cv.lang)}</td>
      <td>${cv.booked?'<span class="dpen-pill-ok">✓ Booked</span>':cv.link?'<span class="dpen-pill-g">Link thichyo</span>':"—"}</td>
      <td style="white-space:nowrap;"><button type="button" class="admin-mini-btn" data-dpen-admin="view" data-sid="${esc(cv.sid)}">${cv.sid===dpenAdm.openSid?"Banda":"Herne"}</button>

async function dpenFetchDay(day){
  const [s,e] = dpenDayRange(day);
  const snap = await getDocs(query(collection(fsdb,"chatLogs"), where("t",">=",s), where("t","<",e)));
  return snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
}
async function dpenLoadDay(day){
  dpenAdm.day = day; dpenAdm.loading = true; dpenAdm.openSid = null; dpenAdmPaint();
  try{
    dpenAdm.logs = await dpenFetchDay(day);
    if(day===dpenToday()) dpenAdm.todayLogs = dpenAdm.logs;
    else if(!dpenAdm.todayLogs) dpenAdm.todayLogs = await dpenFetchDay(dpenToday());
  }catch(e){ console.error("chat history load failed", e); dpenAdm.logs = []; showToast("Chat history load garna sakiyena (Firestore Rules check garnus).", true); }
  dpenAdm.loading = false; dpenAdmPaint();
}
/* TTL ko backup: 30 din bhanda purano log (ek choti ma 300 samma) delete */
async function dpenCleanupOld(){
  try{
    const cutoff = new Date(Date.now() - DPEN_LOG_DAYS*864e5).toISOString();
    const snap = await getDocs(query(collection(fsdb,"chatLogs"), where("t","<",cutoff), fsLimit(300)));
    await Promise.all(snap.docs.map(d=>deleteDoc(d.ref).catch(()=>{})));
  }catch(e){ /* rules/TTL nabhaye pani admin panel chalos */ }
}
async function dpenDeleteLogs(list){
  await Promise.all(list.map(x=>deleteDoc(doc(fsdb,"chatLogs",x.id)).catch(()=>{})));
  const ids = new Set(list.map(x=>x.id));
  dpenAdm.logs = dpenAdm.logs.filter(x=>!ids.has(x.id));
  if(dpenAdm.todayLogs) dpenAdm.todayLogs = dpenAdm.todayLogs.filter(x=>!ids.has(x.id));
  dpenAdmPaint();
}

  e.preventDefault();
  const rect = sec.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height/2;
  document.querySelectorAll(".admin-section.drag-over-top,.admin-section.drag-over-bottom").forEach(n=>{ if(n!==sec) n.classList.remove("drag-over-top","drag-over-bottom"); });
  sec.classList.toggle("drag-over-top", before);
  sec.classList.toggle("drag-over-bottom", !before);
});
document.addEventListener("drop", async (e)=>{
  if(!__dragSecId) return;
  const sec = e.target.closest(".admin-section");
  if(!sec) return;
  e.preventDefault();
  const targetId = sec.dataset.secId;
  const before = sec.classList.contains("drag-over-top");
  document.querySelectorAll(".admin-section.drag-over-top,.admin-section.drag-over-bottom").forEach(n=>n.classList.remove("drag-over-top","drag-over-bottom"));
  const dragId = __dragSecId; __dragSecId = null;
  if(targetId===dragId) return;
  const order = (DB.siteInfo.homeSectionOrder||[]).slice();
  const from = order.indexOf(dragId);
  if(from<0) return;
  order.splice(from,1);
  let to = order.indexOf(targetId);
  if(to<0) return;
  if(!before) to+=1;
  order.splice(to,0,dragId);
  DB.siteInfo.homeSectionOrder = order;
  const ok = await persistDB(); render();
  showToast(ok?"Section order updated.":"Could not save — check your connection, admin sign-in, or try a smaller/fewer photo.", !ok);
});

  `;
  document.body.appendChild(t);

  });
  t.querySelector("#rteFont").addEventListener("change",(e)=>{ if(e.target.value) document.execCommand("fontName", false, e.target.value); });
  t.querySelector("#rteSize").addEventListener("change",(e)=>{ if(e.target.value) document.execCommand("fontSize", false, e.target.value); });

  t.querySelector("#rteHi").addEventListener("input",(e)=>{ document.execCommand("hiliteColor", false, e.target.value); });
  return t;
}
let __rteActiveField = null;
function positionRteToolbar(){
  const t = document.getElementById("rteToolbar");
  const sel = window.getSelection();
  if(!t || !sel || sel.rangeCount===0) return;
  const range = sel.getRangeAt(0);
  const rect = range.getBoundingClientRect();
  if(!rect || (rect.width===0 && rect.height===0)){
    if(__rteActiveField){
      const fr = __rteActiveField.getBoundingClientRect();
      t.style.left = Math.max(8, fr.left)+"px";
      t.style.top = Math.max(8, fr.top-46)+"px";
    }
    return;
  }
  t.style.left = Math.max(8, Math.min(rect.left, window.innerWidth-320))+"px";
  t.style.top = Math.max(8, rect.top-46)+"px";
}
function hideRteToolbar(){
  const t = document.getElementById("rteToolbar");
  if(t) t.classList.remove("show");
}
document.addEventListener("selectionchange", ()=>{
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0) return;
  const anchor = sel.anchorNode;
  const anchorEl = anchor ? (anchor.nodeType===1?anchor:anchor.parentElement) : null;
  const field = anchorEl ? anchorEl.closest('[data-bind][data-rich][contenteditable="true"]') : null;
  if(field && !sel.isCollapsed){
    __rteActiveField = field;
    const t = ensureRteToolbar();
    t.classList.add("show");
    positionRteToolbar();
  } else {
    hideRteToolbar();
  }
});
