/* ===================== LOCAL IMAGE UPLOAD (no URLs — pick from device) ===================== */
function pickAndSetImage(path, onDone, forceAllowAnim){
  let input = document.getElementById("hiddenFileInput");
  if(!input){
    input = document.createElement("input");
    input.type = "file"; input.accept = "image/*"; input.id = "hiddenFileInput"; input.className = "hidden-file-input";
    document.body.appendChild(input);
  }
  input.value = "";
  input.onchange = ()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    const bind = imageAnimBinding(path);
    const allowAnim = !!bind || !!forceAllowAnim;
    openImageEditor(file, allowAnim, bind?bind.get():"up", async (dataUrl, anim)=>{
      try{
        if(path){
          setPath(DB, path, dataUrl);
          if(bind) bind.set(anim);
          const ok = await persistDB(); render();
          showToast(ok?"Photo updated.":"Could not save — check your connection, admin sign-in, or try a smaller/fewer photo.", !ok);
        } else if(onDone){ onDone(dataUrl, anim); }
      }catch(err){ showToast("Could not save that photo — please try again.", true); }
    });
  };
  input.click();
}
/* ADDED: ties a stable per-image "entrance animation" choice to custom-block images (safe because
   custom blocks are addressed by a stable id, unlike plain arrays whose indices shift on delete). */
function imageAnimBinding(path){
  if(!path) return null;
  let m = path.match(/^customBlocks\.(\d+)\.img$/);
  if(m){ const i=+m[1]; return { get:()=> (DB.customBlocks[i]&&DB.customBlocks[i].imgAnim)||"up", set:(v)=>{ if(DB.customBlocks[i]) DB.customBlocks[i].imgAnim=v; } }; }
  m = path.match(/^customBlocks\.(\d+)\.images\.(\d+)$/);
  if(m){ const i=+m[1], j=+m[2]; return { get:()=>{ const b=DB.customBlocks[i]; return (b&&b.imagesAnim&&b.imagesAnim[j])||"up"; }, set:(v)=>{ const b=DB.customBlocks[i]; if(b){ if(!Array.isArray(b.imagesAnim)) b.imagesAnim=[]; b.imagesAnim[j]=v; } } }; }
  return null;
}
function pngLikeType(t){ return t==="image/png" || t==="image/webp" || t==="image/gif" || t==="image/svg+xml"; }
/* ===================== ADDED: image editor — crop + entrance-animation picker ===================== */
let __imgEd = null;
function openImageEditor(file, allowAnim, initialAnim, onApply){
  const reader = new FileReader();
  reader.onerror = ()=> showToast("Could not read that image — please try another file.", true);
  reader.onload = ()=>{
    const img = new Image();
    img.onerror = ()=> showToast("Could not read that image — please try another file.", true);
    img.onload = ()=>{
      __imgEd = { fileType:file.type, natW:img.naturalWidth, natH:img.naturalHeight, dataUrl:reader.result, onApply, allowAnim:!!allowAnim, anim: initialAnim||"up", box:null };
      let m = document.getElementById("imgEditorModal");
      if(!m){ m=document.createElement("div"); m.id="imgEditorModal"; m.className="modal-backdrop"; document.body.appendChild(m); }
      m.innerHTML = renderImgEditorHTML();
      requestAnimationFrame(()=>{ m.classList.add("show"); initCropBox(); });
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function closeImageEditor(){
  const m = document.getElementById("imgEditorModal");
  if(m) m.classList.remove("show");
  __imgEd = null;
}
function renderImgEditorHTML(){
  const opt = (v,label)=> `<option value="${v}" ${__imgEd.anim===v?"selected":""}>${label}</option>`;
  const animSel = __imgEd.allowAnim ? `
    <div class="img-editor-row">
      <label>Entrance animation</label>
      <select id="cropAnimSel">
        ${opt("up","Fade Up (default)")}${opt("zoom","Zoom In")}${opt("left","Slide From Left")}${opt("right","Slide From Right")}${opt("none","None")}
      </select>
    </div>` : "";
  return `
  <div class="modal-box" style="max-width:560px;">
    <h3 style="margin-bottom:6px;">Adjust Photo</h3>
    <p>Drag the gold corners to crop the photo.${__imgEd.allowAnim?" Then pick how it should animate in.":""}</p>
    <div class="img-editor-stage" id="cropStage">
      <img id="cropImg" src="${__imgEd.dataUrl}" alt="">
      <div class="crop-box" id="cropBox">
        <div class="crop-handle nw" data-h="nw"></div><div class="crop-handle ne" data-h="ne"></div>
        <div class="crop-handle sw" data-h="sw"></div><div class="crop-handle se" data-h="se"></div>
      </div>
    </div>
    ${animSel}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button type="button" class="ghost-btn" data-action="close-img-editor">Cancel</button>
      <button type="button" class="gold-btn" data-action="apply-img-editor"><span>Use This Photo</span></button>
    </div>
  </div>`;
}
function initCropBox(){
  const stage = document.getElementById("cropStage");
  const img = document.getElementById("cropImg");
  const box = document.getElementById("cropBox");
  if(!stage||!img||!box) return;
  function place(){
    const w = img.clientWidth, h = img.clientHeight;
    if(!w||!h){ requestAnimationFrame(place); return; }
    stage.style.width = w+"px"; stage.style.height = h+"px";
    const bw = w*0.82, bh = h*0.82;
    __imgEd.box = { x:(w-bw)/2, y:(h-bh)/2, w:bw, h:bh, stageW:w, stageH:h };
    paintBox();
  }
  function paintBox(){
    const b = __imgEd.box;
    box.style.left=b.x+"px"; box.style.top=b.y+"px"; box.style.width=b.w+"px"; box.style.height=b.h+"px";
  }
  if(img.complete && img.naturalWidth) place(); else img.onload = place;
  let mode=null, startX=0, startY=0, startBox=null;
  function within(v,min,max){ return Math.max(min,Math.min(max,v)); }
  box.addEventListener("pointerdown",(e)=>{
    const h = e.target.closest(".crop-handle");
    mode = h ? h.dataset.h : "move";
    startX=e.clientX; startY=e.clientY; startBox=Object.assign({}, __imgEd.box);
    box.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  box.addEventListener("pointermove",(e)=>{
    if(!mode || !__imgEd) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    const b=__imgEd.box, sw=b.stageW, sh=b.stageH, MIN=40;
    if(mode==="move"){
      b.x = within(startBox.x+dx, 0, sw-b.w);
      b.y = within(startBox.y+dy, 0, sh-b.h);
    } else {
      let {x,y,w,h}=startBox;
      if(mode.includes("e")) w = within(startBox.w+dx, MIN, sw-startBox.x);
      if(mode.includes("s")) h = within(startBox.h+dy, MIN, sh-startBox.y);
      if(mode.includes("w")){ const nx = within(startBox.x+dx, 0, startBox.x+startBox.w-MIN); w = startBox.w+(startBox.x-nx); x = nx; }
      if(mode.includes("n")){ const ny = within(startBox.y+dy, 0, startBox.y+startBox.h-MIN); h = startBox.h+(startBox.y-ny); y = ny; }
      b.x=x; b.y=y; b.w=w; b.h=h;
    }
    paintBox();
  });
  box.addEventListener("pointerup",()=>{ mode=null; });
  box.addEventListener("pointercancel",()=>{ mode=null; });
}
function applyImgEditor(){
  if(!__imgEd || !__imgEd.box) return;
  const img = document.getElementById("cropImg");
  const b = __imgEd.box;
  const scaleX = __imgEd.natW / b.stageW, scaleY = __imgEd.natH / b.stageH;
  const sx = b.x*scaleX, sy = b.y*scaleY, sw = b.w*scaleX, sh = b.h*scaleY;
  const usePng = pngLikeType(__imgEd.fileType);
  /* ADDED: shrink adaptively so a single photo can't balloon the (single-document) site data past
     Firestore's 1MB limit — PNG has no quality slider, so it shrinks by resolution instead. */
  /* Lowered so a section with several photos (e.g. 8-10 team/service photos, or the 10 homepage
     mission+gallery photos) can all safely fit within that section's own ~900KB save budget. */
  const TARGET_BYTES = 80000;
  let maxDim = 1000, dataUrl = "", quality = 0.85, tries = 0;
  while(tries < 7){
    let outW = sw, outH = sh;
    if(outW>maxDim || outH>maxDim){
      if(outW>outH){ outH = Math.round(outH*maxDim/outW); outW = maxDim; }
      else { outW = Math.round(outW*maxDim/outH); outH = maxDim; }
    }
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1,Math.round(outW)); canvas.height = Math.max(1,Math.round(outH));
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    dataUrl = usePng ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", quality);
    if(dataUrl.length <= TARGET_BYTES || maxDim<=280) break;
    if(usePng){ maxDim = Math.round(maxDim*0.75); }
    else if(quality > 0.4){ quality -= 0.15; }
    else { maxDim = Math.round(maxDim*0.75); }
    tries++;
  }
  const animSel = document.getElementById("cropAnimSel");
  const anim = __imgEd.allowAnim && animSel ? animSel.value : (__imgEd.anim||"up");
  const cb = __imgEd.onApply;
  closeImageEditor();
  cb && cb(dataUrl, anim);
}

/* ===================== CONFIRM MODAL (delete / sign-out, Yes-or-No) ===================== */
function confirmModal(title, message, opts){
  opts = opts || {};
  const danger = opts.danger !== false;
  return new Promise(resolve=>{
    let m = document.getElementById("confirmModal");
    if(!m){ m = document.createElement("div"); m.id = "confirmModal"; m.className = "modal-backdrop"; document.body.appendChild(m); }
    m.innerHTML = `
      <div class="modal-box confirm-modal-box">
        <div class="warn-icon ${danger?'danger':'neutral'}">${icon(danger?'trash':'logout')}</div>
        <h3>${esc(title)}</h3>
        <p>${esc(message)}</p>
        <div class="confirm-btn-row">
          <button type="button" class="ghost-btn" data-confirm="no">${esc(opts.cancelText||"Cancel")}</button>
          <button type="button" class="${danger?'danger-btn':'gold-btn'}" data-confirm="yes">${esc(opts.confirmText||"Yes, continue")}</button>
        </div>
      </div>`;
    requestAnimationFrame(()=>m.classList.add("show"));
    const finish = (val)=>{ m.classList.remove("show"); resolve(val); };
    m.querySelector('[data-confirm="yes"]').onclick = ()=>finish(true);
    m.querySelector('[data-confirm="no"]').onclick = ()=>finish(false);
    m.onclick = (e)=>{ if(e.target===m) finish(false); };
  });
}

function getPath(obj, path){
  return path.split(".").reduce((o,k)=> (o==null?o:o[k]), obj);
}
function setPath(obj, path, val){
  const keys = path.split(".");
  let cur = obj;
  for(let i=0;i<keys.length-1;i++){ cur = cur[keys[i]]; if(cur==null) return; }
  cur[keys[keys.length-1]] = val;
}

/* ===================== FORMS ===================== */
document.addEventListener("submit", async (e)=>{
  const form = e.target.closest("[data-form]");
  if(!form) return;
  e.preventDefault();
  const type = form.dataset.form;
  const fd = new FormData(form);

  if(type==="appointment"){
    const name = fd.get("name").trim(), phone = fd.get("phone").trim(), email = fd.get("email").trim();
    const subject = fd.get("subject").trim(), service = fd.get("service"), dentist = fd.get("dentist");
    const apptDate = fd.get("apptDate"), apptTime = fd.get("apptTime"), message = (fd.get("message")||"").trim();
    let ok = true;
    toggleFieldError(form,"phone", !validNepalPhone(phone)); if(!validNepalPhone(phone)) ok=false;
    toggleFieldError(form,"email", !validEmail(email)); if(!validEmail(email)) ok=false;
    if(!ok){ showToast("Please fix the highlighted fields.", true); return; }

    const submitBtn = form.querySelector('button[type="submit"]');
    const label = submitBtn.querySelector(".btn-label");
    submitBtn.disabled = true; if(label) label.textContent = "Sending...";

    const me = currentUser();
    const appt = {name,phone,email,subject,service,dentist,date:apptDate,time:apptTime,message,createdAt:new Date().toISOString()};
    if(me) appt.uid = me.uid;
    if(fd.get("source")==="dpen") appt.source = "dpen"; // Dpen chat bhitra ko form bata
    try{
      await addDoc(collection(fsdb,"appointments"), appt);
    }catch(e){
      submitBtn.disabled = false; if(label) label.textContent = "Submit Appointment";
      showToast("Your appointment could not be saved — please check your connection and try again.", true);
      return;
    }
    if(me) MY_APPTS.uid = null; // force refresh next time the dashboard is viewed

    const cfg = DB.siteInfo.emailjs || {};
    if(cfg.serviceId && cfg.templateId && cfg.publicKey && window.emailjs){
      try{
        await emailjs.send(cfg.serviceId, cfg.templateId, {
          patient_name:name, phone:phone, email:email,
          appointment_date:apptDate, appointment_time:apptTime,
          service:service, dentist:dentist, subject:subject, message:message,
          to_email:DB.siteInfo.email
        }, {publicKey:cfg.publicKey});
      }catch(err){
        showToast("Saved, but the automatic email could not be sent (check EmailJS settings in Admin Panel).", true);
      }
    } else {
      showToast("Appointment saved. (Admin: add EmailJS Service ID/Template ID/Public Key in the Admin Panel to auto-send emails.)", true);
    }

    submitBtn.disabled = false; if(label) label.textContent = "Submit Appointment";
    form.reset();
    if(appt.source==="dpen") dpenOnBooked(form);
    showSuccessModal("Request Submitted", "Your appointment request has been submitted successfully. We will contact you shortly.");
    return;
  }
  if(type==="dpen-settings"){
    const num = (k, d, min, max)=>{ let v = parseInt(fd.get(k), 10); if(isNaN(v)) v = d; return Math.min(max, Math.max(min, v)); };
    const str = (k, n)=> String(fd.get(k)||"").trim().slice(0, n);
    DB.siteInfo.dpen = Object.assign({}, dpenCfg(), {
      enabled: fd.get("enabled")==="on",
      deskSide: fd.get("deskSide")==="left" ? "left" : "right", deskBottom: num("deskBottom", 22, 0, 400),
      mobSide: fd.get("mobSide")==="left" ? "left" : "right", mobBottom: num("mobBottom", 16, 0, 400),
      bubbleEnabled: fd.get("bubbleEnabled")==="on", bubbleText: str("bubbleText", 200), bubbleDelay: num("bubbleDelay", 4, 0, 60),
      welcome: str("welcome", 600) || DEFAULT_DB.siteInfo.dpen.welcome,
      extraInfo: str("extraInfo", 4000), extraRules: str("extraRules", 3000),
      showBooking: fd.get("showBooking")==="on", showPhone: fd.get("showPhone")==="on", showWhatsapp: fd.get("showWhatsapp")==="on",
      whatsapp: str("whatsapp", 30), dailyLimit: num("dailyLimit", 50, 1, 500)
    });
    const ok = await persistDB();
    showToast(ok ? "Dpen settings saved." : "Could not save — check your connection or admin sign-in.", !ok);
    render();
    return;
  }
  if(type==="emailjs-settings"){
    DB.siteInfo.emailjs = {
      serviceId:(fd.get("serviceId")||"").trim(),
      templateId:(fd.get("templateId")||"").trim(),
      publicKey:(fd.get("publicKey")||"").trim()
    };
    const ok = await persistDB();
    if(ok && DB.siteInfo.emailjs.publicKey && window.emailjs){ try{ emailjs.init({publicKey:DB.siteInfo.emailjs.publicKey}); }catch(e){} }
    showToast(ok ? "Email settings saved." : "Could not save — check your connection, admin sign-in, or try a smaller/fewer photo.", !ok);
    render();
    return;
  }
  if(type==="seo-settings"){
    const ogImageUrl = (fd.get("ogImageUrl")||"").trim();
    DB.siteInfo.seo = Object.assign({}, DB.siteInfo.seo, {
      defaultTitle:(fd.get("defaultTitle")||"").trim(),
      defaultDescription:(fd.get("defaultDescription")||"").trim(),
      keywords:(fd.get("keywords")||"").trim(),
      ogImageUrl: ogImageUrl
    });
    const ok = await persistDB();
    // If admin set a public URL, update static HTML og:image meta tags immediately in the DOM
    if(ok && ogImageUrl){
      document.querySelector('meta[property="og:image"]') && (document.querySelector('meta[property="og:image"]').content = ogImageUrl);
      document.querySelector('meta[name="twitter:image"]') && (document.querySelector('meta[name="twitter:image"]').content = ogImageUrl);
    }
    showToast(ok?"Default SEO settings saved.":"Could not save — check your connection, admin sign-in, or try a smaller/fewer photo.", !ok);
    render();
    return;
  }
  if(type==="adsense-settings"){
    DB.siteInfo.adsense = Object.assign({}, DB.siteInfo.adsense, {
      publisherId:(fd.get("publisherId")||"").trim(),
      autoAds: fd.get("autoAds")==="on"
    });
    const ok = await persistDB();
    if(ok) applyAdsense();
    showToast(ok ? "AdSense settings saved." : "Could not save — check your connection, admin sign-in, or try a smaller/fewer photo.", !ok);
    render();
    return;
  }
  if(type==="adstxt-settings"){
    DB.siteInfo.adsense = Object.assign({}, DB.siteInfo.adsense, {
      adsTxtContent:(fd.get("adsTxtContent")||"").trim()
    });
    const ok = await persistDB();
    showToast(ok ? "ads.txt content saved. Remember to also upload it as a file on your hosting." : "Could not save — check your connection, admin sign-in, or try a smaller/fewer photo.", !ok);
    render();
    return;
  }
  if(type==="login"){
    const id = fd.get("id").trim(), pw = fd.get("password");
    let email = id;
    if(!validEmail(id)){
      try{
        const snap = await getDoc(doc(fsdb,"phoneIndex",id));
        if(!snap.exists()){ showToast("Invalid credentials.", true); return; }
        email = snap.data().email;
      }catch(e){ showToast("Invalid credentials.", true); return; }
    }
    const submitBtn = form.querySelector('button[type="submit"]');
    if(submitBtn) submitBtn.disabled = true;
    try{
      await signInWithEmailAndPassword(fbAuth, email, pw);
      showToast("Welcome back!");
      navigate("/dashboard");
    }catch(err){
      showToast("Invalid credentials.", true);
    }finally{
      if(submitBtn) submitBtn.disabled = false;
    }
    return;
  }
  if(type==="signup"){
    const name = fd.get("name").trim(), email = fd.get("email").trim(), phone = fd.get("phone").trim(), password = fd.get("password");
    toggleFieldError(form,"phone", !validNepalPhone(phone));
    if(!validNepalPhone(phone)){ showToast("Please enter a valid Nepal phone number.", true); return; }
    const submitBtn = form.querySelector('button[type="submit"]');
    if(submitBtn) submitBtn.disabled = true;
    try{
      const cred = await createUserWithEmailAndPassword(fbAuth, email, password);
      try{ await updateProfile(cred.user, {displayName:name}); }catch(e){}
      const profileSaved = await persistOwnProfile(cred.user.uid, {name, email, phone});
      try{ await setDoc(doc(fsdb,"phoneIndex",phone), {email}); }catch(e){}
      MY_PROFILE = {name, email, phone};
      showToast(profileSaved ? ("Account created — welcome, "+name+"!") : "Account created, but your profile details could not be saved — check Firestore rules.", !profileSaved);
      navigate("/dashboard");
    }catch(err){
      showToast(err && err.code==="auth/email-already-in-use" ? "An account with this email already exists." : "Could not create account.", true);
    }finally{
      if(submitBtn) submitBtn.disabled = false;
    }
    return;
  }
  if(type==="comment"){
    let u = guestOrUser();
    if(!u) u = await ensureGuestSession();
    if(!u){ showToast("Could not connect — please try again in a moment.", true); return; }
    const nid = form.dataset.nid;
    const guestName = (fd.get("guestName")||"").trim();
    const displayName = u.isAnonymous ? (guestName || "Guest") : u.name;
    const text = fd.get("text").trim();
    if(!text) return;
    try{
      await addDoc(collection(fsdb,"comments"), {newsId:nid, uid:u.uid, name:displayName, text, date:new Date().toISOString(), guest:!!u.isAnonymous});
      showToast("Comment posted.");
      form.reset();
      ensureCommentsLikesLoaded(true);
    }catch(e){ showToast("Comment could not be saved — check your connection or Firestore rules.", true); }
    return;
  }
  if(type==="patientvoice"){
    const u = currentUser(); if(!u) return;
    const text = fd.get("text").trim();
    if(!text) return;
    try{
      await addDoc(collection(fsdb,"patientVoices"), {uid:u.uid, name:u.name, rating:+fd.get("rating"), text, approved:false, date:new Date().toISOString()});
      showToast("Thanks! Your review is pending admin approval.");
      form.reset();
      MY_VOICES.uid = null; // force refresh next time the dashboard is viewed
    }catch(e){ showToast("Your review could not be saved — check your connection or Firestore rules.", true); }
    return;
  }
});
function toggleFieldError(form, name, isErr){
  const input = form.querySelector(`[name="${name}"]`);
  if(!input) return;
  input.closest(".field").classList.toggle("error", !!isErr);
}

boot();

</script>
</body>
</html>
