<div id="introSplash" aria-hidden="true">

<div id="app"></div>
<script>
const LOGO = "/logo.webp";
window.LOGO = LOGO;
(function(){
  var simg = document.getElementById("splashLogoImg");
  if(simg) simg.src = LOGO;
  var start = Date.now();
  /* the full intro only when the visitor lands on the home page; any other page gets a short one */
  var onHome = (location.pathname || "/") === "/";
  var minShow = onHome ? 1500 : 300, maxShow = onHome ? 4500 : 2500;
  function dismiss(){
    var el = document.getElementById("introSplash");
    if(!el || el.__dismissed) return;
    el.__dismissed = true;
    var elapsed = Date.now() - start;
    var wait = Math.max(0, minShow - elapsed);
    setTimeout(function(){
      el.classList.add("hide");
      setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); }, 900);
    }, wait);
  }
  if(document.readyState === "complete"){ dismiss(); }
  else { window.addEventListener("load", dismiss); }
  setTimeout(dismiss, maxShow);
})();
</script>
<script type="module" src="/app.js?v=f8d9f5f620"></script>
